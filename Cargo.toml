[package]
name = "citadel"
version = "0.5.0"
edition = "2021"
description = "Local knowledge vault and MCP server for web documentation and Markdown folders"
license = "Apache-2.0"
repository = "https://github.com/MaximeBeretvas/citadel"

[features]
default = ["chrome"]
chrome = ["spider/chrome", "dep:tempfile"]

[dependencies]
anyhow = "1"
axum = "0.8"
clap = { version = "4", features = ["derive", "env"] }
cliclack = "0.3"
directories = "5"
flate2 = "1"
glob = "0.3"
lol_html = "2"
mime_guess = "2"
notify = "7"
notify-debouncer-mini = "0.5"
open = "5"
pulldown-cmark = "0.12"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
rusqlite = { version = "0.40", features = ["bundled", "functions", "hooks"] }
rust-embed = "8"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
similar = "2"
spider = { version = "2.54", default-features = false, features = ["sync", "sitemap", "regex", "headers", "encoding", "time", "reqwest_rustls_tls", "string_interner_buffer_backend"] }
spider_transformations = "2.39"
tempfile = { version = "3", optional = true }
tar = "0.4"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
toml_edit = "0.22"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2"

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
